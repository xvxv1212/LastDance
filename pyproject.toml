[project]
name = "gwonri-chaebi-backend"
version = "0.1.0"
description = "권리채비 AI - AI Agent 기반 시민 생활계약·분쟁 상담 준비 서비스 백엔드 (DB 중심, Clean Architecture)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",   # 운영 DB(PostgreSQL) 드라이버
    "argon2-cffi>=23.1",      # v0.9 비밀번호 Argon2id 해시
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]

# ---------------------------------------------------------------------------
# 린터 설정 (Ruff) : 스타일 + 버그 패턴 + 보안(S, flake8-bandit 규칙) 동시 점검
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (미사용 import·변수 등)
    "I",        # import 정렬
    "B",        # flake8-bugbear (흔한 버그 패턴)
    "UP",       # pyupgrade (최신 문법)
    "S",        # flake8-bandit (보안 취약 패턴)
    "SIM",      # 단순화 가능 코드
    "N",        # 네이밍 규칙
    "C4",       # 컴프리헨션
    "RUF",      # Ruff 고유 규칙
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 한글 주석·문자열의 전각 문자 경고는 의도된 것이므로 제외
    "B008",                        # FastAPI Depends() 기본값 패턴은 프레임워크 관례
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # 테스트의 assert·더미 비밀번호 허용

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = ["tests"]
